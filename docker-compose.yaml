services:
  crawler:
    container_name: crawler
    build: .
    env_file: ".env"
    depends_on:
      database:
        condition: service_healthy
        restart: true
  database:
    container_name: postgres
    image: postgres:latest
    restart: always
    env_file: ".env"
    volumes:
      - postgresql:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      retries: 5
      start_period: 30s
      timeout: 10s

volumes:
  postgresql:
